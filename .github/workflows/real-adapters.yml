name: Real adapters

# Runs the real-debugger integration/smoke suites that the main CI job skips
# (they need debugpy/dlv/netcoredbg installed). Keeps the built-in recipes
# honest against actual adapters: flag renames, changed port announcements,
# changed launch fields.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  real:
    name: Real adapters (debugpy + dlv + netcoredbg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: npm ci --replace-registry-host=always

      - name: Install debugpy
        run: python3 -m pip install debugpy

      - name: Install dlv
        run: go install github.com/go-delve/delve/cmd/dlv@latest

      - name: Install netcoredbg
        run: |
          curl -fsSL -o /tmp/netcoredbg.tar.gz https://github.com/Samsung/netcoredbg/releases/download/3.2.0-1092/netcoredbg-linux-amd64.tar.gz
          sudo tar -xzf /tmp/netcoredbg.tar.gz -C /usr/local
          sudo ln -sf /usr/local/netcoredbg/netcoredbg /usr/local/bin/netcoredbg

      - name: Build and unit tests
        run: npm test

      - name: Real-adapter integration (debugpy + dlv + netcoredbg)
        # DEBUG_DAP_INTEGRATION=1 forces the conditionally-skipped tests.
        run: DEBUG_DAP_INTEGRATION=1 node --test test/integration.test.mjs test/smoke.test.mjs
